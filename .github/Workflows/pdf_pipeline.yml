pipeline:
  mode: batch
  profile: forensic
  fail_safe: true          # jangan pernah gagal total
  immutable_content: true # isi tidak boleh dimodifikasi

paths:
  input_pdfs: input_pdfs
  output: output
  cache: cache/results_cache.json

pdf:
  extract_order: page_strict
  min_text_threshold: 30   # < ini dianggap scan
  preserve_page_order: true

ocr:
  enabled: true
  engine: tesseract
  dpi: 300
  mode: ultra_raw          # tidak normalisasi teks
  languages:
    - eng
    - ind
    - rus
    - jav                  # jika model tersedia
  save_per_page: true
  save_confidence: true
  fallback_if_text_empty: true

content:
  encoding: utf-8
  paragraph_mode: none     # TIDAK gabung baris
  preserve_line_breaks: true
  trim_whitespace: true
  normalize_unicode: false # sangat penting untuk aksara kuno

chapters:
  detection: disabled
  fallback: merge_all
  default:
    id: gabungan
    title: Gabungan Teks

book:
  metadata:
    subtitle: "Antologi Teks dan Ingatan Peradaban"
    author: "Anonim"
    publisher: "Arsip Digital Nusantara"
    language: multi
    readingDirection: ltr

  settings:
    defaultTheme: paper
    defaultFontSize: 17
    enableTTS: true
    enableBookmark: true

estimation:
  method: character
  chars_per_minute: 200

audit:
  enabled: true
  level: forensic
  save_pages: true
  page_hash:
    algorithm: sha256
  book_hash:
    algorithm: sha256
  ocr_report: true
  include_source_pages: true

cache:
  enabled: true
  strategy: file_hash
  skip_if_unchanged: true

logging:
  level: info
  show_skipped: true
  show_processed: true
  show_confidence_warning: true
